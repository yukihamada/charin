name: Charin
options:
  bundleIdPrefix: com.enablerdao
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"

settings:
  base:
    DEVELOPMENT_TEAM: 5BV85JW8US
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: "1.0.0"

targets:
  Charin:
    type: application
    platform: iOS
    entitlements:
      path: Charin/Charin.entitlements
      properties:
        aps-environment: development
    sources:
      - path: Charin/Sources
      - path: Charin/Resources
    info:
      path: Charin/Info.plist
      properties:
        CFBundleDisplayName: チャリン
        CFBundleDevelopmentRegion: ja
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - charin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enablerdao.charin
        PRODUCT_NAME: Charin
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    dependencies:
      - sdk: MessageUI.framework
    entitlements:
      path: Charin/Charin.entitlements

  CharinWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CharinWidget/
    info:
      path: CharinWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enablerdao.charin.widget
        TARGETED_DEVICE_FAMILY: 1
        DEVELOPMENT_TEAM: 5BV85JW8US
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: CharinWidget/CharinWidget.entitlements
    dependencies:
      - target: Charin
