name: iOS TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: charin-ios-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Generate and build simulator
        working-directory: ios
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project Charin.xcodeproj -scheme Charin -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Archive and upload
        working-directory: ios
        env:
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_CONTENT" && test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER"
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys" build/release
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$ASC_KEY_CONTENT" | base64 -d > "$KEY"
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M%S)"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion $(CURRENT_PROJECT_VERSION)' Charin/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString $(MARKETING_VERSION)' Charin/Info.plist
          xcodebuild -project Charin.xcodeproj -scheme Charin -configuration Release -destination 'generic/platform=iOS' -archivePath build/release/Charin.xcarchive CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO archive
          xcodebuild -exportArchive -archivePath build/release/Charin.xcarchive -exportOptionsPlist ../release/ExportOptions.plist -exportPath build/release/export -allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER"
